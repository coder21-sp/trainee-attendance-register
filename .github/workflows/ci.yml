name: Register checks

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      APP_ENV: development
      SECRET_KEY: django-insecure-ci-only-key-for-synthetic-tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: printf 'DATABASE_PATH=%s/register.sqlite3\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test -v 2
      - run: |
          for script in training/static/*.js; do
            node --check "$script" || exit 1
          done
          node --test tests/*.test.cjs

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: development
      SECRET_KEY: django-insecure-ci-only-key-for-synthetic-browser-tests
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt
      - run: printf 'DATABASE_PATH=%s/browser-register.sqlite3\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements.txt -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python manage.py test training.browser_checks -v 2
